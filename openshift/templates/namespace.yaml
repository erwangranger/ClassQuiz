apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: classquiz-namespace
  annotations:
    description: "Template for creating the classquiz namespace with labels and optional quotas"
    tags: "namespace,classquiz"
objects:
- apiVersion: v1
  kind: Namespace
  metadata:
    name: ${NAMESPACE}
    labels:
      app: classquiz
      environment: ${ENVIRONMENT}
    annotations:
      openshift.io/description: "Namespace for ClassQuiz application"
      openshift.io/display-name: "ClassQuiz"
- apiVersion: v1
  kind: ResourceQuota
  metadata:
    name: classquiz-quota
    namespace: ${NAMESPACE}
  spec:
    hard:
      ${QUOTA_SPEC}

parameters:
- name: NAMESPACE
  description: "The name of the namespace to create"
  value: classquiz
  required: true
- name: ENVIRONMENT
  description: "The environment (dev, test, prod)"
  value: dev
  required: true
- name: QUOTA_SPEC
  description: "Resource quota specification in YAML format (leave empty for no quota)"
  value: ""
  required: false

message: |-
  Namespace ${NAMESPACE} has been processed:
  - Created/validated namespace with labels and annotations
  ${QUOTA_STATUS}

post:
- oc get namespace ${NAMESPACE} -o yaml
- oc get resourcequota -n ${NAMESPACE}