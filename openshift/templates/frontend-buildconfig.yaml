apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: classquiz-frontend
spec:
  source:
    type: Git
    git:
      uri: https://github.com/erwangranger/ClassQuiz.git
      ref: test/try3
    contextDir: frontend
  strategy:
    type: Source
    sourceStrategy:
      from:
        kind: DockerImage
        name: registry.access.redhat.com/ubi8/nodejs-20
  output:
    to:
      kind: ImageStreamTag
      name: classquiz-frontend:latest
  triggers:
    - type: ConfigChange
    - type: ImageChange
    - type: GitHub
      github:
        secret: github-webhook-secret