apiVersion: apps/v1
kind: Deployment
metadata:
  name: classquiz-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: classquiz-frontend
  template:
    metadata:
      labels:
        app: classquiz-frontend
    spec:
      containers:
      - name: frontend
        image: classquiz-frontend:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20