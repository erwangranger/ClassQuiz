apiVersion: v1
kind: Service
metadata:
  name: {{ include "classquiz.fullname" . }}-postgresql
  labels:
    {{- include "classquiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: postgresql
      protocol: TCP
      name: postgresql
  selector:
    {{- include "classquiz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgresql