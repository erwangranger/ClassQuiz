apiVersion: v1
kind: Service
metadata:
  name: {{ include "classquiz.fullname" . }}-meilisearch
  labels:
    {{- include "classquiz.labels" . | nindent 4 }}
    app.kubernetes.io/component: meilisearch
spec:
  type: ClusterIP
  ports:
    - port: 7700
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "classquiz.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: meilisearch