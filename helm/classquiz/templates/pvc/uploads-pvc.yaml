{{- if .Values.storage.uploads.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "classquiz.fullname" . }}-uploads
  labels:
    {{- include "classquiz.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.storage.uploads.accessMode | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.uploads.size | quote }}
  storageClassName: {{ .Values.global.storageClass }}
{{- end }}